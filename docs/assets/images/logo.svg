<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f26" />
      <stop offset="100%" stop-color="#0e0f12" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4da3ff" />
      <stop offset="100%" stop-color="#1c8cff" />
    </linearGradient>
    <linearGradient id="caseOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3f4d" />
      <stop offset="100%" stop-color="#1f222b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#logoBg)" stroke="url(#caseOutline)" stroke-width="1.5" />

  <!-- Ambient pulse dot -->
  <circle cx="39" cy="9" r="2.5" fill="#34c759" />

  <!-- Left Earbud Graphic -->
  <g transform="translate(6, 6)">
    <!-- Earbud Head -->
    <ellipse cx="14" cy="14" rx="6.5" ry="5.5" fill="#f5f5f7" />
    <!-- Earbud Stem -->
    <path d="M16 16 L20 28 C20.5 29.5 19.5 31 18 31 C16.5 31 15.5 29.8 15 28.5 L12 18 Z" fill="#e5e5ea" />
    <!-- Blue Accent Sensor Strip -->
    <path d="M17.5 21 L18.5 25" stroke="url(#accentGlow)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Acoustic Vent -->
    <circle cx="12" cy="13" r="1.2" fill="#2c2c2e" />
  </g>

  <!-- Sound Arc Waves -->
  <path d="M30 18 C33 21 33 27 30 30" stroke="url(#accentGlow)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M35 15 C39 19 39 29 35 33" stroke="url(#accentGlow)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45" />
</svg>
