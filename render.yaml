services:
  # Render Static Site (Recommended: 100% Free, Global Edge CDN, Zero Cold Starts)
  - type: web
    name: miearbuddy
    runtime: static
    buildCommand: ""
    staticPublishPath: ./docs
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
